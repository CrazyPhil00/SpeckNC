; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = FluidNC/src
include_dir = FluidNC/include
test_dir = FluidNC/tests
data_dir = FluidNC/data
default_envs = wifi
extra_configs=
    platformio_override.ini
;debug.ini

[common_env_data]
lib_deps_builtin =
    SPI

[common]
build_flags =
    !python git-version.py
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DWS_MAX_QUEUED_MESSAGES=32
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DASYNCWEBSERVER_LOG_LEVEL=ASYNC_WS_LOG_NONE
    -DASYNCWEBSERVER_USE_CHUNK_INFLIGHT=1
    -Wno-unused-variable
    -Wno-unused-function
lib_deps =
    TMCStepper@>=0.7.0,<1.0.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.4.1
bt_deps =
    BluetoothSerial
wifi_deps =
    ESP32Async/AsyncTCP
    ESPAsyncWebServer=https://github.com/MitchBradley/ESPAsyncWebServer.git#WebDAV

[common_esp32_base]
platform = https://github.com/platformio/platform-espressif32.git
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@^3.20017.241212
board_build.arduino.upstream_packages = no

upload_speed = 921600
board_build.partitions = min_littlefs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_flags =
    --eol=LF
monitor_filters=esp32_exception_decoder
board_build.f_flash = 80000000L
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags} -std=gnu++17 -D_GLIBCXX_HAVE_DIRENT_H -D__FLUIDNC
    -IFluidNC/esp32
build_src_filter =
    +<**/*.h> +<**/*.s> +<**/*.S> +<**/*.cpp> +<**/*.c>
    +<../stdfs>
    -<WebUI>
    -<BTConfig.cpp>

lib_extra_dirs =
    libraries

[common_esp32]
extends = common_esp32_base
          FluidNC/ld/esp32/vtable_in_dram.py
board = esp32dev
build_src_filter =
    ${common_esp32_base.build_src_filter}
    +<../esp32/*.c>
    +<../esp32/*.cpp>
    +<../esp32/esp32/*.c>
    +<../esp32/esp32/*.cpp>
build_flags =
    ${common_esp32_base.build_flags}
    -IFluidNC/esp32/esp32
    -DMCU=\"esp32\"

[common_esp32s3]
extends = common_esp32_base
extra_scripts =
    FluidNC/ld/esp32s3/vtable_in_dram.py
board = esp32-s3-devkitc-1
build_src_filter =
    ${common_esp32_base.build_src_filter}
    +<../esp32/*.c>
    +<../esp32/*.cpp>
    +<../esp32/esp32s3/*.c>
    +<../esp32/esp32s3/*.cpp>
    -<../esp32/esp32s3/USBCDCChannel_IDF.cpp>
build_flags =
    ${common_esp32_base.build_flags}
    -IFluidNC/esp32/esp32s3
    -DMCU=\"esp32s3\"
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
debug_tool = esp-builtin

[common_wifi]
build_src_filter = +<WebUI>
build_flags = -DVARIANT=\"wifi\"

[common_bt]
build_src_filter = +<BTConfig.cpp> +<WebUI/WebCommands.cpp>
build_flags = -DVARIANT=\"bt\"

[common_noradio]
build_src_filter =
build_flags = -DVARIANT=\"noradio\"

[env:debug]
extends = common_esp32
build_type = debug
lib_deps = ${common.lib_deps}

[env:noradio]
extends = common_esp32
lib_deps = ${common.lib_deps}
build_src_filter =
    ${common_esp32.build_src_filter}
    ${common_esp32.build_src_filter}
build_flags =
    ${common_esp32.build_flags}
    ${common_noradio.build_flags}

[env:wifi]
extends = common_esp32
lib_deps = ${common.lib_deps} ${common.wifi_deps}
build_src_filter =
    ${common_esp32.build_src_filter}
    ${common_wifi.build_src_filter}
build_flags =
    ${common_esp32.build_flags}
    ${common_wifi.build_flags}

[env:bt]
extends = common_esp32
lib_deps = ${common.lib_deps} ${common.bt_deps}
build_src_filter =
    ${common_esp32.build_src_filter}
    ${common_bt.build_src_filter}
build_flags =
    ${common_esp32.build_flags}
    ${common_bt.build_flags}

[env:noradio_s3]
extends = common_esp32s3
lib_deps = ${common.lib_deps}
build_src_filter =
    ${common_esp32s3.build_src_filter}
    ${common_noradio.build_src_filter}
build_flags =
    ${common_esp32s3.build_flags}
    ${common_noradio.build_flags}

[env:wifi_s3]
extends = common_esp32s3
lib_deps = ${common.lib_deps} ${common.wifi_deps}
build_src_filter =
    ${common_esp32s3.build_src_filter}
    ${common_wifi.build_src_filter}
build_flags =
    ${common_esp32s3.build_flags}
    ${common_wifi.build_flags}

[env:windows_x86]
lib_ldf_mode = chain
platform = windows_x86
test_build_src = true
build_src_filter =
    +<**/*.h> +<**/*.s> +<**/*.S> +<**/*.cpp> +<**/*.c>
    +<../capture>
    +<../win32>
    -<I2SOut.cpp>
    -<Machine/I2CBus.cpp>
    -<BTConfig.cpp>
    -<Motors/Trinamic*.cpp>
    -<Motors/TMC*.cpp>
    -<Motors/*Servo.cpp>
    -<Motors/Dynamixel2.cpp>
    -<Motors/Solenoid.cpp>
    -<Pins/DebugPinDetail.cpp>
    -<WebUI>
    -<OLED*.cpp>
    -<SSD1306_I2C.cpp>
build_flags =
    -std=gnu++17
    -mconsole
    -lcomdlg32
    -limagehlp
    -lpsapi
    -IFluidNC/capture
    -IFluidNC/win32
lib_compat_mode = off

[env:posix]
lib_ldf_mode = chain
platform = native
test_build_src = true
build_src_filter =
    +<**/*.h> +<**/*.s> +<**/*.S> +<**/*.cpp> +<**/*.c>
    +<../capture>
    +<../posix>
    -<I2SOut.cpp>
    -<Machine/I2CBus.cpp>
    -<BTConfig.cpp>
    -<Motors/Trinamic*.cpp>
    -<Motors/TMC*.cpp>
    -<Motors/*Servo.cpp>
    -<Motors/Dynamixel2.cpp>
    -<Motors/Solenoid.cpp>
    -<Pins/DebugPinDetail.cpp>
    -<WebUI>
    -<OLED*.cpp>
    -<SSD1306_I2C.cpp>
    -<Spindles/VFD/*>
    +<Spindles/VFD/VFDProtocol.cpp>
    +<Spindles/VFD/GenericProtocol.cpp>
build_flags =
    -g
    -std=c++20
    -IFluidNC/capture
    -IFluidNC/posix
    -lpthread
lib_compat_mode = off

[tests_common]
platform = native
test_framework = googletest
test_build_src = true
build_src_filter =
    +<Configuration/Completer.cpp>
    +<Pins/PinOptionsParser.cpp>
    +<string_util.cpp>
    +<UTF8.cpp>
    +<Regexpr.cpp>
    +<Error.cpp>
    +<FluidError.cpp>
    +<test_main.cpp>
    +<tests/StringUtilTest.cpp>
    +<tests/UTF8Test.cpp>
    +<tests/UtilityTest.cpp>
    +<tests/RegexprTest.cpp>
    +<tests/ErrorBehaviorTest.cpp>
    +<tests/StateTest.cpp>
    +<tests/CommandCompletionTest.cpp>
    +<tests/FluidErrorTest.cpp>
build_flags = -std=c++17 -g -IFluidNC/capture
lib_compat_mode = off
lib_deps =
    google/googletest @ ^1.15.2

[env:tests]
extends = tests_common

[env:tests_coverage]
extends = tests_common
build_flags = ${tests_common.build_flags} -O0 --coverage
extra_scripts = coverage_build.py