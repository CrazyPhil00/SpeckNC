        function mapInputToAxisLimit(doc, pinName, inputCfg) {
            const axisKey = String(inputCfg.axis || "x").toLowerCase();
            const direction = String(inputCfg.direction || "Min").toLowerCase();
            const axis = doc.axes[axisKey];
            if (!axis || !axis.motor0) return;
            if (direction === "max") axis.motor0.limit_pos_pin = pinName;
            else axis.motor0.limit_neg_pin = pinName;
            axis.motor0.hard_limits = true;
        }

        function applyAxisSettings(doc, axisKey, data) {
            const axis = doc.axes[axisKey];
            if (!axis) return;
            axis.steps_per_mm = toNum(data["axis-steps"], axis.steps_per_mm);
            axis.max_rate_mm_per_min = toNum(data["axis-speed"], axis.max_rate_mm_per_min);
            axis.acceleration_mm_per_sec2 = toNum(data["axis-accel"], axis.acceleration_mm_per_sec2);
            axis.max_travel_mm = toNum(data["axis-max-travel"], axis.max_travel_mm);
            axis.soft_limits = toBool(data["axis-soft-limits"], axis.soft_limits);
            axis.motor0.hard_limits = toBool(data["axis-hard-limits"], axis.motor0.hard_limits);
            const invert = toBool(data["axis-invert"], false);
            const dir = String(axis.motor0.standard_stepper.direction_pin || "");
            if (invert && !dir.includes(":low")) axis.motor0.standard_stepper.direction_pin = `${dir}:low`;
            if (!invert) axis.motor0.standard_stepper.direction_pin = dir.replace(":low", "");
            if (!toBool(data["axis-enable"], true)) {
                axis.motor0.standard_stepper.step_pin = "NO_PIN";
                axis.motor0.standard_stepper.direction_pin = "NO_PIN";
                axis.motor0.standard_stepper.disable_pin = "NO_PIN";
            }
        }

        function buildConfigYamlFromGui() {
            const pins = config?.pins || {};
            const doc = JSON.parse(JSON.stringify(BASE_CONFIG));

            const axisMap = HARDWARE_PIN_MAP.axis_headers;
            Object.keys(axisMap).forEach(pinId => {
                if (pins[pinId]) applyAxisSettings(doc, axisMap[pinId], pins[pinId]);
            });

            const inputMap = { input1: "digital0_pin", input2: "digital1_pin", input3: "digital2_pin", input4: "digital3_pin" };
            Object.keys(inputMap).forEach(inputId => {
                const data = pins[inputId];
                const targetKey = inputMap[inputId];
                const pinName = HARDWARE_PIN_MAP.headers[inputId] || "NO_PIN";
                if (!data || !toBool(data["input-enabled"], true)) {
                    doc.user_inputs[targetKey] = "NO_PIN";
                    return;
                }
                doc.user_inputs[targetKey] = pinName;
                const fn = String(data["input-function"] || "limit").toLowerCase();
                const activeLow = String(data["input-activeState"] || "high").toLowerCase() === "low";
                const normalizedPin = activeLow ? `${pinName}:pu` : pinName;
                if (fn === "estop") doc.control.estop_pin = normalizedPin;
                if (fn === "probe") doc.probe.pin = normalizedPin;
                if (fn === "limit") mapInputToAxisLimit(doc, normalizedPin, {
                    axis: data["input-axis"],
                    direction: data["input-direction"]
                });
            });

            const relayMap = { relay1: "digital0_pin", relay2: "digital1_pin", relay3: "digital2_pin" };
            Object.keys(relayMap).forEach(relayId => {
                const data = pins[relayId];
                const targetKey = relayMap[relayId];
                if (!data || !toBool(data["relay-enabled"], true)) {
                    doc.user_outputs[targetKey] = "NO_PIN";
                    return;
                }
                doc.user_outputs[targetKey] = HARDWARE_PIN_MAP.headers[relayId] || "NO_PIN";
            });

            if (pins.output1 && toBool(pins.output1["output-enabled"], false)) {
                doc.user_outputs.digital3_pin = HARDWARE_PIN_MAP.headers.output1 || "NO_PIN";
            }

            return objectToYaml(doc) + "\n";
        }

        function parseFirmwareInfo(text) {
            const parts = text.split("#").map(p => p.trim());
            for (const part of parts) {
                const tokens = part.split(":");
                const key = (tokens[0] || "").trim().toLowerCase();
                if (key === "webcommunication") {
                    fluid.websocketPort = (tokens[2] || fluid.websocketPort).trim();
                    fluid.websocketHost = (tokens[3] || window.location.hostname).trim();
                }
            }
        }

        function websocketUrl() {
            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            const host = fluid.websocketHost || window.location.hostname;
            const defaultPort = protocol === "wss" ? "443" : "80";
            if (fluid.websocketPort && fluid.websocketPort !== defaultPort) {
                return `${protocol}://${host}:${fluid.websocketPort}`;
            }
            return `${protocol}://${host}`;
        }

        function updateAxisDisplay(x, y, z, kind = "mpos") {
            if (kind === "wpos") {
                updateTelemetry({
                    wpos_x: Number.isFinite(x) ? x : telemetry.wpos_x,
                    wpos_y: Number.isFinite(y) ? y : telemetry.wpos_y,
                    wpos_z: Number.isFinite(z) ? z : telemetry.wpos_z
                });
                return;
            }
            updateTelemetry({
                mpos_x: Number.isFinite(x) ? x : telemetry.mpos_x,
                mpos_y: Number.isFinite(y) ? y : telemetry.mpos_y,
                mpos_z: Number.isFinite(z) ? z : telemetry.mpos_z
            });
        }

        function parseStatusMessage(line) {
            if (!line.startsWith("<") || !line.endsWith(">")) return;
            const inner = line.slice(1, -1);
            const fields = inner.split("|");
            if (fields.length > 0) {
                const machineState = fields[0];
                setConnectionState(true, machineState);
                updateTelemetry({ machine_state: machineState });
            }

            for (const field of fields) {
                if (field.startsWith("MPos:")) {
                    const values = field.substring(5).split(",");
                    updateAxisDisplay(parseFloat(values[0]), parseFloat(values[1]), parseFloat(values[2]), "mpos");
                } else if (field.startsWith("WPos:")) {
                    const values = field.substring(5).split(",");
                    updateAxisDisplay(parseFloat(values[0]), parseFloat(values[1]), parseFloat(values[2]), "wpos");
                } else if (field.startsWith("FS:")) {
                    const values = field.substring(3).split(",");
                    updateTelemetry({
                        feed_rate: Number.parseFloat(values[0]),
                        spindle_rpm: Number.parseFloat(values[1])
                    });
                } else if (field.startsWith("Bf:")) {
                    const values = field.substring(3).split(",");
                    updateTelemetry({
                        planner_buffer: Number.parseFloat(values[0]),
                        serial_buffer: Number.parseFloat(values[1])
                    });
                } else if (field.startsWith("Ln:")) {
                    updateTelemetry({ line_number: Number.parseFloat(field.substring(3)) });
                }
            }
        }

        function startSocket() {
            if (fluid.ws) fluid.ws.close();
            fluid.ws = new WebSocket(websocketUrl(), ["arduino"]);

            fluid.ws.onopen = () => {
                setConnectionState(true);
                sendFluidCommand("?", true).catch(() => {});
            };
            fluid.ws.onclose = () => {
                setConnectionState(false);
                fluid.reconnectTimer = setTimeout(startSocket, 3000);
            };
            fluid.ws.onerror = () => {
                setConnectionState(false);
            };
            fluid.ws.onmessage = async (event) => {
                let msg = "";
                if (typeof event.data === "string") {
                    msg = event.data;
                } else if (event.data instanceof Blob) {
                    msg = await event.data.text();
                } else if (event.data instanceof ArrayBuffer) {
                    return;
                } else {
                    return;
                }
                const parts = msg.split(":");
                if (parts[0] === "currentID" || parts[0] === "CURRENT_ID") {
                    fluid.pageId = parts[1] || "";
                    return;
                }
                if (parts[0] === "ERROR") {
                    logConsole(parts.slice(2).join(":") || "Web error", "error");
                    return;
                }
                parseStatusMessage(msg);
                if (!msg.startsWith("PING:")) {
                    logConsole(msg, msg.toLowerCase().includes("error") ? "error" : "receive");
                }
            };
        }

        async function sendFluidCommand(command, silent = false) {
            if (!command) return "";
            logConsole(command, "send");
            const endpoint = silent ? "/command_silent" : "/command";
            let url = `${endpoint}?commandText=${encodeURIComponent(command)}`;
            if (fluid.pageId) url += `&PAGEID=${encodeURIComponent(fluid.pageId)}`;
            const response = await fetch(url, { method: "GET" });
            if (!response.ok) {
                const errorText = await response.text();
                if ((errorText || "").toLowerCase().includes("websocket dead")) {
                    setConnectionState(false);
                    if (!fluid.reconnectTimer) {
                        fluid.reconnectTimer = setTimeout(() => {
                            fluid.reconnectTimer = null;
                            startSocket();
                        }, 200);
                    }
                }
                throw new Error(errorText || `HTTP ${response.status}`);
            }
            const text = await response.text();
            if (text && (command.startsWith("[ESP") || command.startsWith("$/"))) {
                text.split(/\r?\n/).filter(Boolean).forEach(line => logConsole(line, "receive"));
            }
            return text;
        }

        function loadConfiguration(terminalId) {
            const activeSection = document.querySelector('.config-section.active');
            if (!activeSection) return;

            const savedData = config.pins[terminalId] || {};

            activeSection.querySelectorAll('input, select').forEach(input => {
                let key;
                if (input.type === 'checkbox') {
                    key = input.name || 'enabled';
                } else if (input.type === 'radio') {
                    key = input.name;
                } else {
                    key = input.id || input.name;
                }

                if (savedData.hasOwnProperty(key)) {
                    if (input.type === 'checkbox') {
                        input.checked = savedData[key];
                    } else if (input.type === 'radio') {
                        input.checked = (input.value === savedData[key]);
                    } else {
                        input.value = savedData[key];
                    }
                } else {
                    if (input.type === 'checkbox') {
                        input.checked = input.defaultChecked;
                    } else if (input.type === 'radio') {
                        input.checked = input.defaultChecked;
                    } else if (input.tagName === 'SELECT') {
                        Array.from(input.options).forEach(opt => {
                            opt.selected = opt.defaultSelected;
                        });
                    } else {
                        input.value = input.defaultValue;
                    }
                }
            });
        }

        function getHotspotCoords(hotspotElement) {
            const pcbRect = pcbImage.getBoundingClientRect();
            const svgRect = pcbHotspots.getBoundingClientRect();
            
            const x = parseFloat(hotspotElement.getAttribute('x'));
            const y = parseFloat(hotspotElement.getAttribute('y'));
            const width = parseFloat(hotspotElement.getAttribute('width'));
            const height = parseFloat(hotspotElement.getAttribute('height'));

            const viewBox = pcbHotspots.getAttribute('viewBox').split(' ');
            const svgWidth = parseFloat(viewBox[2]);
            const svgHeight = parseFloat(viewBox[3]);
            
            const scaleX = svgRect.width / svgWidth;
            const scaleY = svgRect.height / svgHeight;

            const xViewport = pcbRect.left + (x * scaleX);
            const yViewport = pcbRect.top + (y * scaleY);
            const widthViewport = width * scaleX;
            const heightViewport = height * scaleY;

            return { 
                x: xViewport, 
                y: yViewport, 
                width: widthViewport, 
                height: heightViewport,
                right: xViewport + widthViewport,
                bottom: yViewport + heightViewport,
                centerX: xViewport + widthViewport / 2,
                centerY: yViewport + heightViewport / 2
            };
        }

        function positionConfigPanel(hotspotCoords) {
            const panelRect = configPanel.getBoundingClientRect();
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const padding = 20;

            let panelLeft, panelTop;

            panelLeft = hotspotCoords.right + padding;
            
            if (panelLeft + panelRect.width > windowWidth - padding) {
                panelLeft = hotspotCoords.x - panelRect.width - padding;
            }
            
            if (panelLeft < padding || panelLeft + panelRect.width > windowWidth - padding) {
                panelLeft = (windowWidth - panelRect.width) / 2;
            }

            panelTop = hotspotCoords.y;
            
            if (panelTop + panelRect.height > windowHeight - padding) {
                panelTop = windowHeight - panelRect.height - padding;
            }
            
            if (panelTop < padding) {
                panelTop = padding;
            }

            configPanel.style.left = `${panelLeft}px`;
            configPanel.style.top = `${panelTop}px`;
        }

            configPanel.classList.remove('open');

            if (currentActiveHotspot) {
                currentActiveHotspot.classList.remove('active');
                currentActiveHotspot = null;
            }
            highlightOverlay.classList.remove('visible');
        }

        document.addEventListener('click', (event) => {
            if (configPanel.classList.contains('open')) {
                const isClickInsidePanel = configPanel.contains(event.target);
                const isClickOnHotspot = event.target.closest('.hotspot');
                
                if (!isClickInsidePanel && !isClickOnHotspot) {
                    hidePanel();
                }
            }
        });

        window.addEventListener('resize', () => {
            if (currentActiveHotspot) {
                updateHighlight(currentActiveHotspot);
                if (configPanel.classList.contains('open')) {
                    const coords = getHotspotCoords(currentActiveHotspot);
                    positionConfigPanel(coords);
                }
            }
        });

        function saveConfiguration() {
            const terminalId = currentActiveHotspot?.id;
            if (terminalId) {
                const activeSection = document.querySelector('.config-section.active');
                const formData = {};
                
                activeSection.querySelectorAll('input, select').forEach(input => {
                    if (input.type === 'checkbox') {
                        formData[input.name || 'enabled'] = input.checked;
                    } else if (input.type === 'radio') {
                        if (input.checked) {
                            formData[input.name] = input.value;
                        }
                    } else {
                        formData[input.id || input.name] = input.value;
                    }
                });
                
                config.pins[terminalId] = formData;
                saveConfig();
                logConsole(`Configuration saved for ${currentActiveHotspot.dataset.terminalName}`, 'receive');
                
                const saveBtn = document.querySelector('.save-btn');
                const originalText = saveBtn.innerHTML;
                saveBtn.innerHTML = '<i class="fas fa-check"></i> Saved!';
                setTimeout(() => {
                    saveBtn.innerHTML = originalText;
                }, 2000);
            }
        }

        function resetToDefaults() {
            const terminalId = currentActiveHotspot?.id;
            if (terminalId && confirm('Reset this terminal to default settings?')) {
                delete config.pins[terminalId];
                saveConfig();
                logConsole(`Reset ${currentActiveHotspot.dataset.terminalName} to defaults`, 'receive');
                hidePanel();
            }
        }

                function editFile(filename) {
            currentFile = filename;
            currentFilePath = `${fluid.currentPath}${filename}`.replace("//", "/");
            document.getElementById("editor-filename").textContent = currentFilePath;

            if (!aceEditor) {
                initAceEditor();
            }

            fetch(currentFilePath)
                .then(r => r.text())
                .then(content => {
                    aceEditor.setValue(content, -1);
                    document.getElementById("editor-modal").classList.add("active");
                })
                .catch(err => logConsole(`Open file failed: ${err.message}`, "error"));
        }

        function closeEditor() {
            document.getElementById("editor-modal").classList.remove("active");
            currentFile = null;
            currentFilePath = null;
        }

        async function saveFile() {
            if (!currentFilePath || !aceEditor) return;
            const content = aceEditor.getValue();
            const blob = new Blob([content], { type: "text/plain" });
            const formData = new FormData();
            formData.append(`${currentFilePath}S`, String(blob.size));
            formData.append("myfiles[]", blob, currentFilePath);
            try {
                const response = await fetch("/files", { method: "POST", body: formData });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                logConsole(`File saved: ${currentFilePath}`, "receive");
                closeEditor();
                await refreshFiles();
            } catch (err) {
                logConsole(`Save failed: ${err.message}`, "error");
            }
        }

        async function runFile(filename) {
            const fullPath = `${fluid.currentPath}${filename}`.replace("//", "/");
            try {
                await sendFluidCommand(`[ESP700]${fullPath}`);
            } catch (err) {
                logConsole(`Run failed: ${err.message}`, "error");
            }
        }

        async function uploadFile() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".gcode,.nc,.txt";
            input.multiple = true;
            input.onchange = async (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;
                const formData = new FormData();
                for (const file of files) {
                    const targetPath = `${fluid.currentPath === "/" ? "/" : fluid.currentPath}${file.name}`;
                    formData.append(`${targetPath}S`, String(file.size));
                    formData.append("myfiles[]", file, targetPath);
                }
                try {
                    const response = await fetch("/files", { method: "POST", body: formData });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    logConsole(`Uploaded ${files.length} file(s)`, "receive");
                    await refreshFiles();
                } catch (err) {
                    logConsole(`Upload failed: ${err.message}`, "error");
                }
            };
            input.click();
        }

        function formatBytes(bytes) {
            const value = Number(bytes);
            if (!Number.isFinite(value) || value < 0) return "dir";
            if (value < 1024) return `${value} B`;
            if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
            return `${(value / (1024 * 1024)).toFixed(1)} MB`;
        }

        async function deleteEntry(filename, isDir) {
            if (!confirm(`Delete ${isDir ? "directory" : "file"} '${filename}'?`)) return;
            const action = isDir ? "deletedir" : "delete";
            const url = `/files?action=${action}&filename=${encodeURIComponent(filename)}&path=${encodeURIComponent(fluid.currentPath)}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                await refreshFiles();
            } catch (err) {
                logConsole(`Delete failed: ${err.message}`, "error");
            }
        }

        function renderFileList(items) {
            const listEl = document.getElementById("file-list");
            listEl.innerHTML = "";

            if (fluid.currentPath !== "/") {
                const up = document.createElement("div");
                up.className = "file-item";
                up.innerHTML = `
                    <div class="file-info">
                        <i class="fas fa-level-up-alt file-icon" style="color: var(--text-secondary);"></i>
                        <div class="file-details"><div class="file-name">..</div><div class="file-meta">Parent directory</div></div>
                    </div>`;
                up.onclick = () => {
                    const parts = fluid.currentPath.split("/").filter(Boolean);
                    parts.pop();
                    fluid.currentPath = parts.length ? `/${parts.join("/")}/` : "/";
                    refreshFiles();
                };
                listEl.appendChild(up);
            }

            if (!items.length) {
                listEl.innerHTML = `<div class="console-line receive">No files in ${fluid.currentPath}</div>`;
                return;
            }

            const sorted = [...items].sort((a, b) => {
                if (a.size === -1 && b.size !== -1) return -1;
                if (a.size !== -1 && b.size === -1) return 1;
                return a.name.localeCompare(b.name);
            });

            for (const file of sorted) {
                const isDir = file.size === -1;
                const row = document.createElement("div");
                row.className = "file-item";
                row.innerHTML = `
                    <div class="file-info">
                        <i class="fas ${isDir ? "fa-folder" : "fa-file-code"} file-icon" style="color: ${isDir ? "var(--warning)" : "var(--accent-primary)"};"></i>
                        <div class="file-details">
                            <div class="file-name">${file.name}</div>
                            <div class="file-meta">${isDir ? "Directory" : formatBytes(file.size)}</div>
                        </div>
                    </div>
                    <div class="file-actions">
                        ${isDir ? "" : `<button class="btn btn-secondary action-edit"><i class="fas fa-edit"></i> Edit</button>`}
                        ${isDir ? "" : `<button class="btn btn-success action-run"><i class="fas fa-play"></i> Run</button>`}
                        <button class="btn btn-danger action-del"><i class="fas fa-trash"></i></button>
                    </div>
                `;

                row.onclick = () => {
                    if (isDir) {
                        fluid.currentPath = `${fluid.currentPath}${file.name}/`.replace("//", "/");
                        refreshFiles();
                    } else {
                        openFile(file.name);
                    }
                };

                row.querySelector(".action-del").addEventListener("click", (e) => {
                    e.stopPropagation();
                    deleteEntry(file.name, isDir);
                });

                if (!isDir) {
                    row.querySelector(".action-edit").addEventListener("click", (e) => {
                        e.stopPropagation();
                        editFile(file.name);
                    });
                    row.querySelector(".action-run").addEventListener("click", (e) => {
                        e.stopPropagation();
                        runFile(file.name);
                    });
                }
                listEl.appendChild(row);
            }
        }

        async function refreshFiles() {
            const url = `/files?action=list&filename=all&path=${encodeURIComponent(fluid.currentPath)}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                document.getElementById("file-path").value = fluid.currentPath;
                renderFileList(json.files || []);
            } catch (err) {
                logConsole(`File list failed: ${err.message}`, "error");
            }
        }

        function openFile(filename) {
            const fullPath = `${fluid.currentPath === "/" ? "/" : fluid.currentPath}${filename}`;
            window.open(fullPath, "_blank");
        }
// --- Draggable Logic Implementation ---
        function makeDraggable(element) {
            const header = element.querySelector('.config-header');
            let isDragging = false;
            let startX, startY;

            header.addEventListener('mousedown', (e) => {
                // Ignore clicks on close button
                if (e.target.closest('.close-btn')) return;

                isDragging = true;
                // Calculate cursor offset from element's top-left corner
                startX = e.clientX - element.offsetLeft;
                startY = e.clientY - element.offsetTop;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                // Prevent selecting text while dragging
                e.preventDefault();

                // Calculate new position
                const newLeft = e.clientX - startX;
                const newTop = e.clientY - startY;

                // Basic bounds checking to keep header visible
                const minLeft = -element.offsetWidth + 50;
                const maxLeft = window.innerWidth - 50;
                const minTop = 0;
                const maxTop = window.innerHeight - 50;

                if (newLeft > minLeft && newLeft < maxLeft) {
                    element.style.left = `${newLeft}px`;
                }
                if (newTop > minTop && newTop < maxTop) {
                    element.style.top = `${newTop}px`;
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
        }

        // Initialize Draggable Panel
        makeDraggable(document.getElementById('configPanel'));

        // Initialize
        loadConfig();

        window.downloadConfig = function() {
            const dataStr = JSON.stringify(config, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', 'cnc-config.json');
            linkElement.click();
            logConsole('Configuration downloaded', 'receive');
        };

        window.uploadConfig = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        config = JSON.parse(event.target.result);
                        if (!config.pins || typeof config.pins !== "object") config.pins = {};
                        if (!config.settings || typeof config.settings !== "object") config.settings = {};
                        saveConfig();
                        renderStatusWidgets();
                        logConsole('Configuration loaded successfully', 'receive');
                    } catch (err) {
                        logConsole('Error loading configuration file', 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        };

        function initializeStatusWidgetEditor() {
            const openBtn = document.getElementById("open-status-editor");
            const closeBtn = document.getElementById("close-status-editor");
            const saveBtn = document.getElementById("status-widget-save");
            const addBtn = document.getElementById("status-widget-add");
            const resetBtn = document.getElementById("status-widget-reset");
            const modal = document.getElementById("status-editor-modal");
            const labelEl = document.getElementById("status-widget-label");
            const sourceEl = document.getElementById("status-widget-source");
            const unitEl = document.getElementById("status-widget-unit");
            const decimalsEl = document.getElementById("status-widget-decimals");
            const toneEl = document.getElementById("status-widget-tone");
            const liveEl = document.getElementById("status-widget-live");
            const manualEl = document.getElementById("status-widget-manual");

            renderStatusSourceOptions(sourceEl, "machine_state");

            openBtn?.addEventListener("click", openStatusEditor);
            closeBtn?.addEventListener("click", closeStatusEditor);
            saveBtn?.addEventListener("click", () => {
                closeStatusEditor();
                logConsole("Status widget layout saved", "receive");
            });
            addBtn?.addEventListener("click", addStatusWidget);
            resetBtn?.addEventListener("click", resetStatusWidgetsToDefault);

            modal?.addEventListener("click", (event) => {
                if (event.target === modal) closeStatusEditor();
            });

            labelEl?.addEventListener("input", (event) => {
                mutateSelectedStatusWidget(widget => ({ ...widget, label: event.target.value }));
            });
            sourceEl?.addEventListener("change", (event) => {
                mutateSelectedStatusWidget(widget => ({ ...widget, source: event.target.value }));
            });
            unitEl?.addEventListener("input", (event) => {
                mutateSelectedStatusWidget(widget => ({ ...widget, unit: event.target.value }));
            });
            decimalsEl?.addEventListener("input", (event) => {
                mutateSelectedStatusWidget(widget => ({ ...widget, decimals: Number(event.target.value) }));
            });
            toneEl?.addEventListener("change", (event) => {
                mutateSelectedStatusWidget(widget => ({ ...widget, tone: event.target.value }));
            });
            liveEl?.addEventListener("change", (event) => {
                manualEl.disabled = event.target.checked;
                mutateSelectedStatusWidget(widget => ({ ...widget, live: event.target.checked }));
            });
            manualEl?.addEventListener("input", (event) => {
                mutateSelectedStatusWidget(widget => ({ ...widget, manualValue: event.target.value }));
            });
        }

        window.addEventListener('load', () => {
            document.getElementById("home-all-btn").addEventListener("click", async () => {
                try {
                    await sendFluidCommand("$H");
                } catch (err) {
                    logConsole(`Home failed: ${err.message}`, "error");
                }
            });

            document.getElementById("estop-btn").addEventListener("click", async () => {
                if (!confirm("Send soft reset (E-Stop)?")) return;
                try {
                    await sendFluidCommand("\x18", true);
                } catch (err) {
                    logConsole(`E-Stop failed: ${err.message}`, "error");
                }
            });

            const toolbar = document.querySelector('.file-toolbar');
            if (toolbar) {
                const configBtns = document.createElement('div');
                configBtns.style.cssText = 'display: flex; gap: 0.5rem; margin-left: auto;';
                configBtns.innerHTML = `
                    <button class="btn btn-secondary" onclick="downloadConfig()">
                        <i class="fas fa-download"></i> Export Config
                    </button>
                    <button class="btn btn-secondary" onclick="uploadConfig()">
                        <i class="fas fa-upload"></i> Import Config
                    </button>
                `;
                toolbar.appendChild(configBtns);
            }

            initializeStatusWidgetEditor();
            renderStatusWidgets();
            initFluidNC();
            refreshFiles();
            refreshRealtimeStatus();
            refreshUserOutputVoltages();
            setInterval(refreshRealtimeStatus, 1500);
            setInterval(refreshUserOutputVoltages, 2000);
        });
    </script>
